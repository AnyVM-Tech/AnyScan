[package]
name = "anyscan"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = []
worker-bundle-stealth = []

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
aes-gcm = "0.10"
aws-credential-types = "1"
aws-sdk-s3 = "1"
axum = { version = "0.8", features = ["json", "macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
getrandom = "0.2"
jsonwebtoken = { version = "10.3", features = ["rust_crypto"] }
once_cell = "1.21"
redis = { version = "1.2", features = ["tls-rustls", "streams"] }
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "blocking", "socks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
time = "0.3"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal", "time", "net", "sync", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "1"
thiserror = "2"
libc = "0.2"
num_cpus = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = { version = "2.5", features = ["serde"] }
zstd = "0.13"
